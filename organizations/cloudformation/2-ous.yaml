AWSTemplateFormatVersion: '2010-09-09'
Description: Organizational Units and Security accounts

Parameters:
  RootId:
    Type: String
  ProjectPrefixLower:
    Type: String
    Default: acme
    Description: Lowercase project prefix used for CloudFormation exports
  AuditEmail:
    Type: String
  LogArchiveEmail:
    Type: String

Resources:
  SecurityOU:
    Type: AWS::Organizations::OrganizationalUnit
    Properties:
      Name: Security
      ParentId: !Ref RootId

  InfrastructureOU:
    Type: AWS::Organizations::OrganizationalUnit
    Properties:
      Name: Infrastructure
      ParentId: !Ref RootId

  WorkloadsOU:
    Type: AWS::Organizations::OrganizationalUnit
    Properties:
      Name: Workloads
      ParentId: !Ref RootId

  # ==============================================================================
  # Uncomment the following resource when the Sandbox OU is required.
  # ==============================================================================
  # SandboxOU:
  #   Type: AWS::Organizations::OrganizationalUnit
  #   Properties:
  #     Name: Sandbox
  #     ParentId: !Ref RootId

  # Security accounts (needed before Landing Zone creation)
  AuditAccount:
    Type: AWS::Organizations::Account
    Properties:
      AccountName: Audit
      Email: !Ref AuditEmail
      ParentIds:
        - !GetAtt SecurityOU.Id

  LogArchiveAccount:
    Type: AWS::Organizations::Account
    Properties:
      AccountName: Log Archive
      Email: !Ref LogArchiveEmail
      ParentIds:
        - !GetAtt SecurityOU.Id

Outputs:
  SecurityOUId:
    Value: !GetAtt SecurityOU.Id
    Export:
      Name: !Sub '${ProjectPrefixLower}-org-SecurityOUId'

  InfrastructureOUId:
    Value: !GetAtt InfrastructureOU.Id
    Export:
      Name: !Sub '${ProjectPrefixLower}-org-InfrastructureOUId'

  InfrastructureOUArn:
    Value: !GetAtt InfrastructureOU.Arn
    Export:
      Name: !Sub '${ProjectPrefixLower}-org-InfrastructureOUArn'

  WorkloadsOUId:
    Value: !GetAtt WorkloadsOU.Id
    Export:
      Name: !Sub '${ProjectPrefixLower}-org-WorkloadsOUId'

  WorkloadsOUArn:
    Value: !GetAtt WorkloadsOU.Arn
    Export:
      Name: !Sub '${ProjectPrefixLower}-org-WorkloadsOUArn'

  # ==============================================================================
  # Uncomment the following output when the Sandbox OU is required.
  # ==============================================================================
  # SandboxOUArn:
  #   Value: !GetAtt SandboxOU.Arn
  #   Export:
  #     Name: !Sub '${ProjectPrefixLower}-org-SandboxOUArn'

  AuditAccountId:
    Value: !GetAtt AuditAccount.AccountId
    Export:
      Name: !Sub '${ProjectPrefixLower}-org-AuditAccountId'

  LogArchiveAccountId:
    Value: !GetAtt LogArchiveAccount.AccountId
    Export:
      Name: !Sub '${ProjectPrefixLower}-org-LogArchiveAccountId'
